// QuakeJS Chti Arena - Default Client Configuration
// This file is executed automatically on client startup

// Movement (AZERTY) - use lowercase for letter keys (Quake3 engine requirement)
bind z "+forward"
bind s "+back"
bind q "+moveleft"
bind d "+moveright"
bind SPACE "+moveup"
bind c "+movedown"
bind SHIFT "+speed"

// View
bind MOUSE1 "+attack"
bind MOUSE2 "+strafe"
bind MWHEELUP "weapnext"
bind MWHEELDOWN "weapprev"

// Weapons
bind 1 "weapon 1"
bind 2 "weapon 2"
bind 3 "weapon 3"
bind 4 "weapon 4"
bind 5 "weapon 5"
bind 6 "weapon 6"
bind 7 "weapon 7"
bind 8 "weapon 8"
bind 9 "weapon 9"
bind 0 "weapon 10"
bind q "weapon 1"
bind e "weapon 3"

// Gameplay
bind TAB "+scores"
bind ESCAPE "togglemenu"
bind ` "toggleconsole"
bind F1 "vote yes"
bind F2 "vote no"
bind F3 "readyteam"
bind F12 "screenshot"

// Chat
bind t "messagemode"
bind y "messagemode2"
bind u "messagemode3"

// Settings - optimized for performance
seta cg_drawCrosshair "4"
seta cg_crosshairSize "24"
seta cg_crosshairColor "6"
seta cg_drawGun "1"
seta cg_fov "110"
seta sensitivity "4.5"
seta cl_mouseAccel "0"
seta m_pitch "0.022"
seta m_yaw "0.022"
seta r_mode "-1"
seta r_customwidth "1920"
seta r_customheight "1080"
seta r_fullscreen "1"
seta s_volume "0.8"
seta s_musicvolume "0.5"
seta com_maxfps "144"
seta cl_maxpackets "125"
seta rate "25000"
seta snaps "40"
seta name "Chti_Warrior"
seta model "sarge"
seta headmodel "sarge"
seta team_model "sarge"
seta team_headmodel "sarge"
seta cg_autoAction "2"
seta cg_teamChatTime "3000"
seta cg_teamChatHeight "8"
seta cg_drawFriend "1"
seta cg_drawAttacker "1"
seta cg_drawRewards "1"
seta cg_drawAmmoWarning "1"
seta cg_drawIcons "1"
seta cg_draw3dIcons "1"
seta cg_simpleItems "0"
seta cg_brassTime "2500"
seta cg_gibs "1"
seta cg_marks "1"
seta cg_shadows "1"
seta cg_dynamicCrosshair "1"
seta cg_zoomfov "22.5"
seta cg_zoomScaling "1"
seta cg_thirdPerson "0"
seta cg_thirdPersonRange "40"
seta cg_thirdPersonAngle "0"

// DISABLE resource-heavy UI elements (performance fix)
seta cg_lagometer "0"
seta cg_drawFPS "0"
seta cg_drawTimer "0"
seta cg_drawStatus "0"
seta cg_draw2D "1"

// HUD
seta cg_drawCrosshairNames "1"
seta cg_crosshairHealth "1"
seta cg_crosshairPulse "1"
seta cg_drawSnapshot "0"
seta cg_scorePlums "1"

// Network
seta cl_packetdup "1"
seta cl_timeNudge "0"
seta cl_timenudge "0"

echo "Ché tout bon ! Configuré par votre poto Simon ;) !"
echo "Chti Arena config loaded - Have fun!"